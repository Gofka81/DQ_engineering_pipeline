version: '3.8'

services:
  postgres-prefect:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 5s
      timeout: 5s
      retries: 5

  prefect-server:
    image: prefecthq/prefect:3-python3.11
    container_name: prefect-server
    restart: unless-stopped
    ports:
      - "4200:4200"
    depends_on:
      postgres-prefect:
        condition: service_healthy
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@postgres-prefect:5432/prefect
      PREFECT_UI_API_URL: http://127.0.0.1:4200/api
      PREFECT_API_URL: http://prefect-server:4200/api   # internal
    command: prefect server start --host 0.0.0.0

  prefect-worker:
    build:
      context: ./prefect
      dockerfile: Dockerfile
    container_name: prefect-worker
    restart: unless-stopped
    depends_on:
      - prefect-server
      - redis
      - postgres-prefect
      - minio
    volumes:
      - ./prefect:/prefect
    env_file:
      - .env
    environment:
      # Prefect settings
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_RESULTS_DEFAULT_SERIALIZER: "pickle"
      PREFECT_RESULTS_PERSIST_BY_DEFAULT: "true"
      PYTHONPATH: /prefect
      # Override hostnames for Docker network
      POSTGRES_HOST: postgres
      MINIO_ENDPOINT: minio:9000
      REDIS_HOST: redis
    command: >
      bash -c "
      prefect deploy --all &&
      python redis_worker.py &
      REDIS_PID=$$! &&
      trap 'kill -TERM $$REDIS_PID $$PREFECT_PID 2>/dev/null' TERM INT &&
      prefect worker start --pool default-agent-pool &
      PREFECT_PID=$$! &&
      wait -n &&
      kill -TERM $$REDIS_PID $$PREFECT_PID 2>/dev/null
      "

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres-data:
  redis-data:
  minio-data: