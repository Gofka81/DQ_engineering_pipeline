version: '3.8'

services:
  postgres-prefect:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 5s
      timeout: 5s
      retries: 5

  prefect-server:
    image: prefecthq/prefect:3-python3.11
    container_name: prefect-server
    restart: unless-stopped
    ports:
      - "4200:4200"
    depends_on:
      postgres-prefect:
        condition: service_healthy
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@postgres-prefect:5432/prefect
      PREFECT_UI_API_URL: ${PREFECT_UI_API_URL:-http://localhost:4200/api}
      PREFECT_API_URL: http://prefect-server:4200/api   # internal
    command: prefect server start --host 0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  prefect-worker:
    build:
      context: ./prefect
      dockerfile: Dockerfile
    container_name: prefect-worker
    restart: unless-stopped
    depends_on:
      prefect-server:
        condition: service_healthy
      redis:
        condition: service_started
      postgres-prefect:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - logs:/logs
    environment:
      # Prefect settings
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_RESULTS_DEFAULT_SERIALIZER: "pickle"
      PREFECT_RESULTS_PERSIST_BY_DEFAULT: "true"
      PYTHONPATH: /prefect
      # Override hostnames for Docker network
      POSTGRES_HOST: postgres
      MINIO_ENDPOINT: minio:9000
      REDIS_HOST: redis
      # Injected from Portainer UI / .env
      POSTGRES_USER: ${POSTGRES_USER:-prefect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prefect}
      BACKEND_DB: ${BACKEND_DB:-backend}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_JOBS_QUEUE: ${REDIS_JOBS_QUEUE:-jobs}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LLM_API_KEY: ${LLM_API_KEY:-}
    command: >
      bash -c "
      prefect deploy --all &&
      python redis_worker.py &
      REDIS_PID=$$! &&
      trap 'kill -TERM $$REDIS_PID $$PREFECT_PID 2>/dev/null' TERM INT &&
      prefect worker start --pool default-agent-pool &
      PREFECT_PID=$$! &&
      wait -n $$REDIS_PID $$PREFECT_PID &&
      kill -TERM $$REDIS_PID $$PREFECT_PID 2>/dev/null
      "

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 30s
      timeout: 20s
      retries: 3

  backend:
    container_name: backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8020:8000"
    depends_on:
      postgres-prefect:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      MINIO_ENDPOINT: minio:9000
      REDIS_HOST: redis
      # Injected from Portainer UI / .env
      POSTGRES_USER: ${POSTGRES_USER:-prefect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prefect}
      BACKEND_DB: ${BACKEND_DB:-backend}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_JOBS_QUEUE: ${REDIS_JOBS_QUEUE:-jobs}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-200}
      LLM_API_KEY: ${LLM_API_KEY:-}

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
  minio-data:
  logs: